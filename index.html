<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Popup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            color: white;
        }

        .container h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .container p {
            opacity: 0.7;
        }

        /* POPUP */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup.show {
            display: flex;
        }

        .popup-box {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .popup-box h2 {
            margin-bottom: 10px;
            color: #1e2a3a;
        }

        .popup-box p {
            margin-bottom: 20px;
            color: #555;
            line-height: 1.5;
        }

        .popup-box .ok-btn {
            background: #4a8db7;
            border: none;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 0 #2d5f7a;
            transition: 0.1s ease;
        }

        .popup-box .ok-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2d5f7a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👋 Hello!</h1>
        <p>Popup will appear automatically...</p>
    </div>

    <!-- POPUP -->
    <div class="popup" id="popup">
        <div class="popup-box">
            <h2>haha</h2>
            <p>noob</p>
            <button class="ok-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        function showPopup() {
            document.getElementById('popup').classList.add('show');
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('show');
        }

        document.getElementById('popup').addEventListener('click', function(e) {
            if (e.target === this) {
                closePopup();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePopup();
            }
        });

        window.addEventListener('load', function() {
            setTimeout(function() {
                showPopup();
            }, 1);
        });
    </script>

</body>
</html>
